<main class="recovery">
  <section class="recovery__card" aria-labelledby="recovery-title">
    <a routerLink="/">300 Lugares</a>
    <h1 id="recovery-title">Recuperar contraseña</h1>
    <p>Te enviaremos un código a tu correo para recuperar el acceso.</p>
    <form #form="ngForm" (ngSubmit)="onForgotPassword(form)">
      <div class="recovery__field">
        <label for="recovery-email">Correo electrónico</label>
        <input id="recovery-email" name="email" type="email" autocomplete="email" [(ngModel)]="email" required email #correo="ngModel" />
        @if (correo.invalid && correo.touched) { <span class="recovery__error">Escribe un correo válido.</span> }
      </div>
      <button type="submit" class="btn-primary" [disabled]="isLoading() || form.invalid" [attr.aria-busy]="isLoading()">{{ isLoading() ? 'Enviando…' : 'Enviar código' }}</button>
    </form>
    @if (error()) { <p class="recovery__error" role="alert">{{ error() }}</p> }
    <nav class="recovery__links"><a [routerLink]="['/login', userType]">Volver a iniciar sesión</a></nav>
  </section>
</main>
