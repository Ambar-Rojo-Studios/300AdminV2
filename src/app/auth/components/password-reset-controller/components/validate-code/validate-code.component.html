<main class="recovery">
  <section class="recovery__card" aria-labelledby="validate-title">
    <h1 id="validate-title">Confirma el código</h1>
    <p>Revisa tu correo y escribe el código de 6 dígitos. También puedes revisar la carpeta de spam.</p>
    <form #form="ngForm" (ngSubmit)="onValidatePassword(form)">
      <div class="recovery__field">
        <label for="validate-email">Correo electrónico</label>
        <input id="validate-email" name="email" type="email" [(ngModel)]="email" autocomplete="email" required email />
      </div>
      <div class="recovery__field">
        <label for="validate-code">Código de recuperación</label>
        <input id="validate-code" name="code" [(ngModel)]="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required />
      </div>
      <button type="submit" class="btn-primary" [disabled]="isLoading() || form.invalid">{{ isLoading() ? 'Validando…' : 'Confirmar código' }}</button>
    </form>
    @if (error()) { <p class="recovery__error" role="alert">{{ error() }}</p> }
    <nav class="recovery__links"><a routerLink="/forgot-password" [queryParams]="{ tipo: state.userType }">Solicitar otro código</a><a [routerLink]="['/login', state.userType]">Volver al login</a></nav>
  </section>
</main>
