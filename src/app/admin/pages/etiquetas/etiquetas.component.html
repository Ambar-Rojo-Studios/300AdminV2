<section class="admin-page">
  <div class="header-actions">
    <h2>Etiquetas</h2>
    <button type="button" class="create-btn" aria-label="Crear etiqueta" title="Crear etiqueta" (click)="abrirModalCrear()">
      <i class="fa fa-plus" aria-hidden="true"></i>
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="etiquetasOrdenadas()"
    [loading]="isLoading()"
    emptyMessage="No hay etiquetas para mostrar."
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    [sortKey]="sortKey()"
    [sortDirection]="sortDirection()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
  >
    <ng-template let-row>
      <button type="button" class="edit-btn" [attr.aria-label]="'Editar ' + row.fldNombre" (click)="abrirModalEditar(row)">
        <i class="fas fa-edit" aria-hidden="true"></i>
      </button>
      <button type="button" class="delete-btn" [attr.aria-label]="'Eliminar ' + row.fldNombre" (click)="abrirModalEliminar(row)">
        <i class="fas fa-trash" aria-hidden="true"></i>
      </button>
    </ng-template>
  </app-data-table>

  <app-modal [open]="showFormModal()" [title]="modalTitle()" (closed)="cerrarModalFormulario()">
    <form #etiquetaForm="ngForm" (ngSubmit)="onSubmit(etiquetaForm)" id="etiquetaForm">
      <app-text-field
        label="Nombre"
        name="fldNombre"
        #fldNombre="ngModel"
        [(ngModel)]="etiqueta().fldNombre"
        [required]="true"
        [invalid]="!!(fldNombre.invalid && fldNombre.touched)"
        errorMessage="El nombre es obligatorio."
      ></app-text-field>

      <app-select-field
        label="Categoría"
        name="fkIdCategoriaEtiqueta"
        #fkIdCategoriaEtiqueta="ngModel"
        placeholder="Selecciona una categoría"
        [options]="categoriaOptions()"
        [(ngModel)]="etiqueta().fkIdCategoriaEtiqueta"
        [required]="true"
        [invalid]="!!(fkIdCategoriaEtiqueta.invalid && fkIdCategoriaEtiqueta.touched)"
        errorMessage="Selecciona una categoría."
      ></app-select-field>

      <app-textarea-field
        label="Descripción"
        name="fldDescripcion"
        [rows]="3"
        [(ngModel)]="etiqueta().fldDescripcion"
      ></app-textarea-field>

      <div class="form-group" style="margin-top:8px;">
        <label style="display:flex;align-items:center;gap:6px;font-weight:400;">
          <input type="checkbox" name="fldEsVisible" [(ngModel)]="etiqueta().fldEsVisible" />
          Visible (aparece en filtros y app móvil)
        </label>
      </div>
    </form>

    <ng-container modal-footer>
      <button type="button" class="btn-secondary" (click)="cerrarModalFormulario()" [disabled]="isSaving()">Cancelar</button>
      <button type="submit" form="etiquetaForm" class="btn-primary" [disabled]="etiquetaForm.invalid || isSaving()">
        {{ isSaving() ? 'Guardando...' : (modalMode() === 'edit' ? 'Actualizar' : 'Guardar') }}
      </button>
    </ng-container>
  </app-modal>

  <app-confirm-dialog
    [open]="showDeleteModal()"
    title="Confirmar eliminación"
    message="¿Seguro que deseas eliminar la etiqueta"
    [itemName]="etiquetaAEliminar()?.fldNombre ?? null"
    [loading]="isDeleting()"
    (confirm)="confirmarEliminar()"
    (cancel)="cerrarModalEliminar()"
  ></app-confirm-dialog>
</section>
