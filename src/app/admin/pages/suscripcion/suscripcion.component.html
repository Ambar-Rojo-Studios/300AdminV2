<section class="admin-page">
  <div class="header-actions">
    <h2>Suscripciones</h2>
    <button type="button" class="create-btn" aria-label="Crear suscripción" title="Crear suscripción" (click)="abrirModalCrear()">
      <i class="fa fa-plus" aria-hidden="true"></i>
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="suscripcionesOrdenadas()"
    [loading]="isLoading()"
    emptyMessage="No hay suscripciones para mostrar."
    [sortKey]="sortKey()"
    [sortDirection]="sortDirection()"
    (sortChange)="onSortChange($event)"
  >
    <ng-template let-row>
      <button type="button" class="edit-btn" [attr.aria-label]="'Editar ' + row.fldNombre" (click)="abrirModalEditar(row)">
        <i class="fas fa-edit" aria-hidden="true"></i>
      </button>
      <button type="button" class="delete-btn" [attr.aria-label]="'Eliminar ' + row.fldNombre" (click)="abrirModalEliminar(row)">
        <i class="fas fa-trash" aria-hidden="true"></i>
      </button>
    </ng-template>
  </app-data-table>

  <app-modal [open]="showFormModal()" [title]="modalTitle()" (closed)="cerrarModalFormulario()">
    <form #suscripcionForm="ngForm" (ngSubmit)="onSubmit(suscripcionForm)" id="suscripcionForm">
      <app-text-field
        label="Nombre"
        name="fldNombre"
        #fldNombre="ngModel"
        [(ngModel)]="suscripcion().fldNombre"
        [required]="true"
        [invalid]="!!(fldNombre.invalid && fldNombre.touched)"
        errorMessage="El nombre es obligatorio."
      ></app-text-field>

      <app-textarea-field
        label="Descripción"
        name="fldDescripcion"
        [rows]="3"
        [(ngModel)]="suscripcion().fldDescripcion"
      ></app-textarea-field>

      <app-text-field
        label="Precio"
        type="number"
        name="fldPrecio"
        #fldPrecio="ngModel"
        [(ngModel)]="suscripcion().fldPrecio"
        [required]="true"
        [invalid]="!!(fldPrecio.invalid && fldPrecio.touched)"
        errorMessage="El precio es obligatorio."
      ></app-text-field>

      <app-select-field
        label="Tipo"
        name="fldEsSuscripcionDeCliente"
        [options]="tipoOptions"
        [(ngModel)]="suscripcion().fldEsSuscripcionDeCliente"
        [required]="true"
      ></app-select-field>
    </form>

    <ng-container modal-footer>
      <button type="button" class="btn-secondary" (click)="cerrarModalFormulario()" [disabled]="isSaving()">Cancelar</button>
      <button type="submit" form="suscripcionForm" class="btn-primary" [disabled]="suscripcionForm.invalid || isSaving()">
        {{ isSaving() ? 'Guardando...' : (modalMode() === 'edit' ? 'Actualizar' : 'Guardar') }}
      </button>
    </ng-container>
  </app-modal>

  <app-confirm-dialog
    [open]="showDeleteModal()"
    title="Confirmar eliminación"
    message="¿Seguro que deseas eliminar la suscripción"
    [itemName]="suscripcionAEliminar()?.fldNombre ?? null"
    [loading]="isDeleting()"
    (confirm)="confirmarEliminar()"
    (cancel)="cerrarModalEliminar()"
  ></app-confirm-dialog>
</section>
