<section class="admin-page">
  <div class="header-actions">
    <h2>Usuarios</h2>
    <button type="button" class="create-btn" aria-label="Crear usuario" title="Crear usuario" (click)="abrirModalCrear()">
      <i class="fa fa-plus" aria-hidden="true"></i>
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [data]="usuariosOrdenados()"
    [loading]="isLoading()"
    emptyMessage="No hay usuarios para mostrar."
    [sortKey]="sortKey()"
    [sortDirection]="sortDirection()"
    (sortChange)="onSortChange($event)"
  >
    <ng-template let-row>
      <button type="button" class="edit-btn" [attr.aria-label]="'Editar ' + row.fldNombre" (click)="abrirModalEditar(row)">
        <i class="fas fa-edit" aria-hidden="true"></i>
      </button>
      <button type="button" class="delete-btn" [attr.aria-label]="'Eliminar ' + row.fldNombre" (click)="abrirModalEliminar(row)">
        <i class="fas fa-trash" aria-hidden="true"></i>
      </button>
    </ng-template>
  </app-data-table>

  <app-modal [open]="showFormModal()" [title]="modalTitle()" (closed)="cerrarModalFormulario()">
    <form #usuarioForm="ngForm" (ngSubmit)="onSubmit(usuarioForm)" id="usuarioForm">
      <app-text-field
        label="Nombre"
        name="fldNombre"
        #fldNombre="ngModel"
        [(ngModel)]="usuario().fldNombre"
        [required]="true"
        [invalid]="!!(fldNombre.invalid && fldNombre.touched)"
        errorMessage="El nombre es obligatorio."
      ></app-text-field>

      <app-text-field
        label="Teléfono"
        name="fldTelefono"
        #fldTelefono="ngModel"
        [(ngModel)]="usuario().fldTelefono"
        [required]="true"
        [invalid]="!!(fldTelefono.invalid && fldTelefono.touched)"
        errorMessage="El teléfono es obligatorio."
      ></app-text-field>

      <app-text-field
        label="Correo electrónico"
        type="email"
        name="fldCorreoElectronico"
        #fldCorreoElectronico="ngModel"
        [(ngModel)]="usuario().fldCorreoElectronico"
        [required]="true"
        [invalid]="!!(fldCorreoElectronico.invalid && fldCorreoElectronico.touched)"
        errorMessage="Correo inválido."
      ></app-text-field>

      <app-text-field
        [label]="modalMode() === 'create' ? 'Contraseña' : 'Nueva contraseña (dejar vacío para no cambiar)'"
        type="password"
        name="fldContrasenia"
        #fldContrasenia="ngModel"
        [(ngModel)]="usuario().fldContrasenia"
        [required]="modalMode() === 'create'"
        [invalid]="!!(fldContrasenia.invalid && fldContrasenia.touched)"
        errorMessage="La contraseña es obligatoria."
      ></app-text-field>

      <app-select-field
        label="Rol"
        name="fldRol"
        [options]="rolOptions"
        [(ngModel)]="usuario().fldRol"
        [required]="true"
      ></app-select-field>
    </form>

    <ng-container modal-footer>
      <button type="button" class="btn-secondary" (click)="cerrarModalFormulario()" [disabled]="isSaving()">Cancelar</button>
      <button type="submit" form="usuarioForm" class="btn-primary" [disabled]="usuarioForm.invalid || isSaving()">
        {{ isSaving() ? 'Guardando...' : (modalMode() === 'edit' ? 'Actualizar' : 'Guardar') }}
      </button>
    </ng-container>
  </app-modal>

  <app-confirm-dialog
    [open]="showDeleteModal()"
    title="Confirmar eliminación"
    message="¿Seguro que deseas eliminar al usuario"
    [itemName]="usuarioAEliminar()?.fldNombre ?? null"
    [loading]="isDeleting()"
    (confirm)="confirmarEliminar()"
    (cancel)="cerrarModalEliminar()"
  ></app-confirm-dialog>
</section>
