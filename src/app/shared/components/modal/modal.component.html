@if (open()) {
  <div class="modal-overlay" (click)="onOverlayClick()">
    <div
      #dialog tabindex="-1" class="modal-content" [attr.aria-busy]="busy()"
      [style.maxWidth]="maxWidth"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || null"
      (click)="$event.stopPropagation()"
    >
      @if (title() || showCloseButton()) {
        <div class="modal-header">
          <h2>{{ title() }}</h2>
          @if (showCloseButton()) {
            <button type="button" class="close-modal" [disabled]="busy()" (click)="requestClose()" aria-label="Cerrar">
              &times;
            </button>
          }
        </div>
      }

      <div class="modal-body">
        @if (discarding()) {
          <div #discardPrompt tabindex="-1" class="discard-prompt" role="alert">
            <p>Hay cambios sin guardar en esta ficha. ¿Quieres descartarlos?</p>
            <button type="button" class="btn-secondary" (click)="discarding.set(false)">Seguir editando</button>
            <button type="button" class="btn-danger" (click)="discard()">Descartar cambios</button>
          </div>
        }
        <ng-content></ng-content>
      </div>

      <div class="modal-footer">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
