<div class="form-group file-field">
  @if (label()) {
    <label [for]="id()">
      {{ label() }}
      @if (required()) {
        <span class="required">*</span>
      }
    </label>
  }

  @if (previewUrl()) {
    <img
      [src]="previewUrl()"
      alt="Vista previa"
      class="file-preview"
    />
  } @else { <div class="file-preview file-preview--empty"><i class="far fa-image" aria-hidden="true"></i><span>Sin imagen</span></div> }

  <input
    #fileInput [id]="id()"
    type="file"
    [accept]="accept()"
    [multiple]="multiple()"
    [class.is-invalid]="invalid()"
    (change)="handleChange($event)"
  />

  @if (fileName()) {
    <div class="file-selection">
      {{ fileName() }}
      <button type="button" class="btn-secondary" (click)="clear(fileInput)">Deshacer selección</button>
    </div>
  }

  @if (hint() && !(invalid() && errorMessage())) {
    <div class="file-hint">{{ hint() }}</div>
  }

  @if (invalid() && errorMessage()) {
    <div class="invalid-feedback">{{ errorMessage() }}</div>
  }
</div>
