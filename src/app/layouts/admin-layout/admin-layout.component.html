<div class="admin-shell" (document:keydown.escape)="cerrarMenu(menuToggle)">
  <header class="admin-topbar">
    <button #menuToggle type="button" class="icon-btn menu-btn" (click)="alternarMenu()"
      [attr.aria-label]="menuAbierto() ? 'Cerrar menú' : 'Abrir menú'"
      [attr.aria-expanded]="menuAbierto()" aria-controls="admin-sidebar">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <a class="brand" routerLink="/admin/dashboard">
      <span class="brand-mark">300</span>
      <span class="brand-text">Lugares <small>Admin</small></span>
    </a>
    <div class="topbar-actions">
      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      >
        <i class="fas" [class.fa-moon]="theme.theme() === 'light'" [class.fa-sun]="theme.theme() === 'dark'" aria-hidden="true"></i>
      </button>
      <a class="icon-btn" routerLink="/" title="Ver sitio público" aria-label="Ver sitio público">
        <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
      </a>
    </div>
  </header>

  @if (menuAbierto()) {
    <button type="button" class="backdrop" (click)="cerrarMenu(menuToggle)" aria-label="Cerrar menú" tabindex="-1"></button>
  }

  <aside id="admin-sidebar" class="admin-sidebar" [class.open]="menuAbierto()">
    <nav aria-label="Navegación del panel">
      @for (group of navGroups; track group.title) {
        <p class="nav-title">{{ group.title }}</p>
        @for (item of group.items; track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link">
            <i class="fas {{ item.icon }}" aria-hidden="true"></i>
            <span>{{ item.label }}</span>
          </a>
        }
      }
    </nav>
    <button type="button" class="logout" (click)="cerrarSesion()">
      <i class="fas fa-right-from-bracket" aria-hidden="true"></i>
      <span>Cerrar sesión</span>
    </button>
  </aside>

  <main class="admin-content"><router-outlet /></main>
</div>
